{% extends "base.html" %}{% block title %}Register | CivicConnect{% endblock %}{% block content %}
<div class="auth-layout"><div class="auth-aside"><span class="eyebrow">JOIN YOUR COMMUNITY</span><h1>Make your<br>voice count.</h1><p>Create an account to report local issues, support neighbors and track progress.</p></div>
<form class="form-card auth-card" method="post"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><label>Full name<input name="name" required placeholder="Your name"></label><label>Email address<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn primary full">Create account <span>→</span></button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></div>{% endblock %}
