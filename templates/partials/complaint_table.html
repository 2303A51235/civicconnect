<div class="table-wrap"><table><thead><tr><th>Complaint</th><th>Citizen</th><th>Department</th><th>Priority</th><th>Status & assignment</th><th>Action</th></tr></thead><tbody>{% for c in complaints %}<tr><td><a class="text-link" href="{{ url_for('complaint_detail', complaint_id=c.id) }}">{{ c.title }}</a><small>#{{ c.id }} · {{ c.created_at[:10] }}</small></td><td>{{ c.reporter }}</td><td>{{ c.department }}</td><td><span class="priority {{ c.priority|lower }}">{{ c.priority }}</span></td><td><span class="status {{ c.status|lower|replace(' ','-') }}">{{ c.status }}</span></td><td><form class="inline-update" method="post" action="{{ url_for('update_complaint', complaint_id=c.id) }}"><select name="status">{% for s in ['Submitted','Assigned','In Progress','Resolved','Rejected'] %}<option {% if c.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><select name="department">{% for d in departments %}<option {% if c.department==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select><input name="note" placeholder="Update note (optional)"><button class="small-button">Save</button></form></td></tr>{% else %}<tr><td colspan="6">No complaints have been submitted yet.</td></tr>{% endfor %}</tbody></table></div>
